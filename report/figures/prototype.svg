<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="Libertinus Serif, serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a3a5c"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <!-- Traffic VM -->
  <rect x="10" y="440" width="140" height="70" rx="6" fill="#f3f4f6" stroke="#667085"/>
  <text x="80" y="462" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a5c">Traffic VM</text>
  <text x="80" y="480" font-size="11" text-anchor="middle" fill="#1a3a5c">floods · scans</text>
  <text x="80" y="496" font-size="11" text-anchor="middle" fill="#1a3a5c">legitimate flows</text>

  <!-- Firewall VM -->
  <rect x="170" y="10" width="580" height="500" rx="8" fill="none" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="182" y="28" font-size="13" font-weight="bold" fill="#1a3a5c">Firewall VM</text>

  <!-- user space -->
  <rect x="180" y="36" width="560" height="96" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="190" y="52" font-size="11" font-weight="bold" fill="#667085">USER SPACE</text>
  <g font-size="12" fill="#1a3a5c" text-anchor="middle">
    <rect x="190" y="62" width="100" height="56" rx="5" fill="#ffffff" stroke="#2e6da4"/>
    <text x="240" y="86" font-weight="bold">Rule file</text>
    <text x="240" y="103" font-size="11">CIDRs, ports, rates</text>

    <rect x="312" y="62" width="150" height="56" rx="5" fill="#ffffff" stroke="#2e6da4"/>
    <text x="387" y="82" font-weight="bold">Controller</text>
    <text x="387" y="97" font-size="11">libbpf · CO-RE</text>
    <text x="387" y="111" font-size="11">load · pin · update maps</text>

    <rect x="484" y="62" width="110" height="56" rx="5" fill="#ffffff" stroke="#2e6da4"/>
    <text x="539" y="86" font-weight="bold">Metrics / logs</text>
    <text x="539" y="103" font-size="11">counters, drop log</text>

    <rect x="610" y="62" width="120" height="56" rx="5" fill="#ffffff" stroke="#2e6da4"/>
    <text x="670" y="86" font-weight="bold">Containers</text>
    <text x="670" y="103" font-size="11">A (allowed) · B (denied)</text>
  </g>
  <line x1="290" y1="90" x2="310" y2="90" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#a)"/>

  <line x1="180" y1="144" x2="740" y2="144" stroke="#667085" stroke-dasharray="6 4"/>
  <rect x="248" y="137" width="104" height="14" fill="#ffffff"/>
  <text x="300" y="148" font-size="10" text-anchor="middle" fill="#667085">system calls · bpf()</text>

  <!-- kernel -->
  <rect x="180" y="152" width="560" height="350" rx="6" fill="#e8f0f8" stroke="#c7d7ea"/>
  <text x="190" y="168" font-size="11" font-weight="bold" fill="#667085">KERNEL</text>

  <!-- Maps -->
  <rect x="372" y="178" width="190" height="168" rx="6" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="467" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a3a5c">BPF maps (pinned)</text>
  <g font-size="11" fill="#1a3a5c">
    <text x="384" y="220" font-family="DejaVu Sans Mono, monospace" font-size="10.5">cidr_block</text><text x="478" y="220">LPM trie</text>
    <text x="384" y="240" font-family="DejaVu Sans Mono, monospace" font-size="10.5">port_deny</text><text x="478" y="240">hash</text>
    <text x="384" y="260" font-family="DejaVu Sans Mono, monospace" font-size="10.5">rate</text><text x="478" y="260">per-CPU hash</text>
    <text x="384" y="280" font-family="DejaVu Sans Mono, monospace" font-size="10.5">egress_allow</text><text x="478" y="280">hash</text>
    <text x="384" y="300" font-family="DejaVu Sans Mono, monospace" font-size="10.5">counters</text><text x="478" y="300">per-CPU array</text>
    <text x="384" y="320" font-family="DejaVu Sans Mono, monospace" font-size="10.5">drop_log</text><text x="478" y="320">ring buffer</text>
  </g>

  <!-- controller <-> maps, maps -> metrics -->
  <line x1="420" y1="120" x2="420" y2="176" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="414" y="164" font-size="10" text-anchor="end" fill="#1a3a5c">update rules</text>
  <line x1="530" y1="176" x2="530" y2="120" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="536" y="164" font-size="10" fill="#1a3a5c">read counters, log</text>

  <!-- XDP_DROP (top left) -->
  <rect x="192" y="178" width="144" height="60" rx="5" fill="#fdecea" stroke="#c62828"/>
  <text x="264" y="203" font-size="12" font-weight="bold" text-anchor="middle" fill="#c62828">XDP_DROP</text>
  <text x="264" y="221" font-size="10.5" text-anchor="middle" fill="#c62828">sampled into drop_log</text>

  <!-- XDP program -->
  <rect x="192" y="280" width="144" height="128" rx="6" fill="#1a3a5c"/>
  <text x="264" y="300" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">XDP program</text>
  <g font-size="11" fill="#ffffff">
    <text x="200" y="322">1. CIDR blocklist lookup</text>
    <text x="200" y="342">2. port denylist</text>
    <text x="200" y="362">3. per-source rate limit</text>
    <text x="200" y="382">4. counters++</text>
    <text x="200" y="400" font-size="10" fill="#c7d7ea">before sk_buff allocation</text>
  </g>
  <line x1="336" y1="320" x2="370" y2="320" stroke="#9db6d3" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Network stack (bottom middle) -->
  <rect x="396" y="356" width="174" height="70" rx="5" fill="#ffffff" stroke="#9db6d3"/>
  <text x="483" y="378" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a3a5c">Network stack</text>
  <text x="483" y="394" font-size="11" text-anchor="middle" fill="#1a3a5c">sk_buff · IP/TCP</text>
  <rect x="404" y="402" width="158" height="18" rx="3" fill="#ffffff" stroke="#667085" stroke-dasharray="4 3"/>
  <text x="483" y="415" font-size="10" text-anchor="middle" fill="#667085">nftables (baseline runs)</text>

  <!-- NIC driver -->
  <rect x="192" y="440" width="144" height="50" rx="5" fill="#ffffff" stroke="#1a3a5c"/>
  <text x="264" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a3a5c">NIC driver</text>
  <text x="264" y="478" font-size="11" text-anchor="middle" fill="#1a3a5c">virtio_net, native mode</text>

  <!-- traffic arrows -->
  <line x1="150" y1="465" x2="190" y2="465" stroke="#1a3a5c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="264" y1="440" x2="264" y2="410" stroke="#1a3a5c" stroke-width="2" marker-end="url(#a)"/>
  <line x1="264" y1="280" x2="264" y2="240" stroke="#c62828" stroke-width="2" marker-end="url(#r)"/>
  <text x="270" y="264" font-size="11" font-weight="bold" fill="#c62828">drop</text>
  <line x1="336" y1="391" x2="394" y2="391" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="365" y="383" font-size="10" font-weight="bold" text-anchor="middle" fill="#2e7d32">XDP_PASS</text>

  <!-- cgroup hooks -->
  <rect x="580" y="178" width="150" height="110" rx="6" fill="#2e6da4"/>
  <text x="655" y="198" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">cgroup hooks</text>
  <g font-family="DejaVu Sans Mono, monospace" font-size="10.5" fill="#ffffff" text-anchor="middle">
    <text x="655" y="218">connect4 / connect6</text>
    <text x="655" y="234">bind4 / bind6</text>
  </g>
  <text x="655" y="256" font-size="11" text-anchor="middle" fill="#ffffff">lookup egress_allow</text>
  <text x="655" y="274" font-size="11" text-anchor="middle" fill="#ffffff">per container cgroup</text>
  <line x1="578" y1="240" x2="564" y2="240" stroke="#9db6d3" stroke-width="1.2" stroke-dasharray="3 2"/>

  <line x1="670" y1="120" x2="670" y2="176" stroke="#1a3a5c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="676" y="164" font-size="10" fill="#1a3a5c">connect()</text>

  <!-- verdicts -->
  <path d="M620,290 L620,383 Q620,391 612,391 L572,391" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#g)"/>
  <text x="627" y="318" font-size="11" fill="#2e7d32" font-weight="bold">allow</text>
  <line x1="690" y1="290" x2="690" y2="318" stroke="#c62828" stroke-width="2" marker-end="url(#r)"/>
  <text x="690" y="334" font-size="11" text-anchor="middle" fill="#c62828" font-weight="bold">-EPERM</text>
  <text x="690" y="348" font-size="10" text-anchor="middle" fill="#c62828">connect() fails</text>
</svg>
