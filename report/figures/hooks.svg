<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" font-family="Libertinus Serif, serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a3a5c"/>
    </marker>
  </defs>

  <!-- User space -->
  <rect x="55" y="10" width="695" height="80" rx="6" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="65" y="30" font-size="13" font-weight="bold" fill="#667085">USER SPACE</text>
  <rect x="70" y="38" width="180" height="40" rx="5" fill="#ffffff" stroke="#2e6da4"/>
  <text x="160" y="63" font-size="13" text-anchor="middle" fill="#1a3a5c">Applications / containers</text>
  <rect x="270" y="38" width="180" height="40" rx="5" fill="#ffffff" stroke="#2e6da4"/>
  <text x="360" y="63" font-size="13" text-anchor="middle" fill="#1a3a5c">Loader / control plane</text>

  <line x1="55" y1="102" x2="750" y2="102" stroke="#667085" stroke-dasharray="6 4"/>
  <rect x="628" y="94" width="110" height="16" fill="#ffffff"/>
  <text x="683" y="106" font-size="11" text-anchor="middle" fill="#667085">system calls · bpf()</text>

  <!-- Kernel band -->
  <rect x="55" y="110" width="695" height="320" rx="6" fill="#e8f0f8" stroke="#c7d7ea"/>
  <text x="65" y="128" font-size="13" font-weight="bold" fill="#667085">KERNEL</text>

  <!-- connectors (drawn under the kprobe bar) -->
  <g stroke="#2e6da4" stroke-width="1.2">
    <line x1="450" y1="155" x2="500" y2="155"/>
    <line x1="450" y1="210" x2="500" y2="210"/>
    <line x1="450" y1="320" x2="500" y2="320"/>
    <line x1="450" y1="395" x2="500" y2="395"/>
  </g>
  <line x1="450" y1="265" x2="500" y2="265" stroke="#667085" stroke-dasharray="4 3"/>

  <!-- Stack layers -->
  <g font-size="13" fill="#1a3a5c">
    <rect x="70" y="135" width="380" height="40" rx="4" fill="#ffffff" stroke="#9db6d3"/>
    <text x="260" y="160" text-anchor="middle">Socket layer: connect(), bind(), sendmsg()</text>
    <rect x="70" y="190" width="380" height="40" rx="4" fill="#ffffff" stroke="#9db6d3"/>
    <text x="260" y="215" text-anchor="middle">LSM security checks (file, socket, task, bpf)</text>
    <rect x="70" y="245" width="380" height="40" rx="4" fill="#ffffff" stroke="#9db6d3"/>
    <text x="260" y="270" text-anchor="middle">IP / TCP stack · netfilter</text>
    <rect x="70" y="300" width="380" height="40" rx="4" fill="#ffffff" stroke="#9db6d3"/>
    <text x="260" y="325" text-anchor="middle">Traffic control, ingress and egress (sk_buff)</text>
    <rect x="70" y="375" width="380" height="40" rx="4" fill="#ffffff" stroke="#9db6d3"/>
    <text x="260" y="400" text-anchor="middle">NIC driver receive path (raw frame)</text>
  </g>
  <line x1="70" y1="358" x2="450" y2="358" stroke="#c62828" stroke-dasharray="5 3"/>
  <text x="76" y="353" font-size="11" fill="#c62828">sk_buff allocated here</text>

  <!-- kprobe / tracepoint bar -->
  <rect x="462" y="135" width="26" height="280" rx="4" fill="#667085"/>
  <text transform="translate(479,275) rotate(-90)" font-size="12" text-anchor="middle" fill="#ffffff">kprobes / tracepoints: observe any kernel function</text>

  <!-- Hook tags -->
  <g font-size="13">
    <rect x="500" y="135" width="240" height="40" rx="6" fill="#2e6da4"/>
    <text x="512" y="152" font-weight="bold" fill="#ffffff">cgroup/socket</text>
    <text x="512" y="168" font-size="11" fill="#ffffff">per-workload allow / deny of socket ops</text>

    <rect x="500" y="190" width="240" height="40" rx="6" fill="#2e6da4"/>
    <text x="512" y="207" font-weight="bold" fill="#ffffff">BPF LSM</text>
    <text x="512" y="223" font-size="11" fill="#ffffff">allow / deny verdict on the security check</text>

    <rect x="500" y="245" width="240" height="40" rx="6" fill="#ffffff" stroke="#667085" stroke-dasharray="5 3"/>
    <text x="512" y="262" font-weight="bold" fill="#667085">nftables (not eBPF)</text>
    <text x="512" y="278" font-size="11" fill="#667085">conventional baseline, after sk_buff</text>

    <rect x="500" y="300" width="240" height="40" rx="6" fill="#2e6da4"/>
    <text x="512" y="317" font-weight="bold" fill="#ffffff">tc</text>
    <text x="512" y="333" font-size="11" fill="#ffffff">drop / redirect / classify, with skb context</text>

    <rect x="500" y="375" width="240" height="40" rx="6" fill="#1a3a5c"/>
    <text x="512" y="392" font-weight="bold" fill="#ffffff">XDP</text>
    <text x="512" y="408" font-size="11" fill="#ffffff">drop / pass / tx / redirect, before sk_buff</text>
  </g>

  <!-- NIC -->
  <rect x="70" y="445" width="380" height="40" rx="4" fill="#ffffff" stroke="#1a3a5c" stroke-width="1.5"/>
  <text x="260" y="470" font-size="13" text-anchor="middle" fill="#1a3a5c">NIC (hardware)</text>

  <!-- receive path arrow -->
  <line x1="40" y1="478" x2="40" y2="142" stroke="#1a3a5c" stroke-width="2" marker-end="url(#up)"/>
  <text transform="translate(30,310) rotate(-90)" font-size="12" text-anchor="middle" fill="#1a3a5c">receive path: more context, higher cost per packet</text>
</svg>
